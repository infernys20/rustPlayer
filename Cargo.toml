[package]
name = "watchmpv"
version = "0.3.1"
edition = "2024"
license = "GPL-3.0-only"
description = "Password-protected video streaming and synchronized mpv watch parties"

[features]
default = []
client = ["dep:eframe", "dep:reqwest", "dep:tokio-tungstenite"]

[dependencies]
anyhow = "1"
argon2 = "0.5"
axum = { version = "0.8", features = ["ws"] }
clap = { version = "4", features = ["derive", "env"] }
eframe = { version = "0.31", optional = true }
futures-util = "0.3"
http = "1"
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false, optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.29", features = ["rustls-tls-webpki-roots"], optional = true }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["fs"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
tokio-tungstenite = "0.29"
tempfile = "3"

[[bin]]
name = "watchmpv-server"
path = "src/bin/server.rs"

[[bin]]
name = "watchmpv-client"
path = "src/bin/client.rs"
required-features = ["client"]
